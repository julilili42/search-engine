[project]
name = "retrieval-benchmark"
version = "0.1.0"
description = "Benchmark harness for the Tuebingen search API"
requires-python = ">=3.10"
dependencies = [
    "tuebingen-search",
]

[project.scripts]
retrieval-benchmark = "retrieval_benchmark.cli:main"

[tool.uv.sources]
tuebingen-search = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_benchmark"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
