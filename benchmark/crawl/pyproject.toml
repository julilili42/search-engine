[project]
name = "crawl-benchmark"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "lingua-language-detector>=2.1.1",
    "selectolax>=0.4.10",
]

[project.scripts]
crawl-benchmark = "benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["benchmark.py"]
