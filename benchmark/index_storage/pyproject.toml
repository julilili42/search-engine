[project]
name = "index-storage-benchmark"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "tuebingen-search",
]

[project.scripts]
index-storage-benchmark = "index_storage_benchmark:main"

[tool.uv.sources]
tuebingen-search = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["index_storage_benchmark.py"]
